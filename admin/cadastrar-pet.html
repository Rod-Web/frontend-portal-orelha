<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Cadastrar Pet · Painel Orelha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./styles/admin-painel.css" />
    <link rel="stylesheet" href="./styles/components/model.css" />
    <link rel="stylesheet" href="./styles/admin-cadastrar-pet.css" />
  </head>
  <body>
    <div class="painel-layout">
      <!-- ================= SIDEBAR ================= -->
      <aside class="sidebar" id="sidebar">

        <div class="sair sair-sidebar"id="sair">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Sair</span>
        </div>

        <div class="sidebar-logo">
          <a href="./dashboard.html" class="logo-link">
            <img src="../img/logodois.png" alt="Portal Orelha" />
          </a>
        </div>

        <nav class="sidebar-nav">
          <p class="nav-grupo">Menu principal</p>
          <a href="./dashboard.html" class="nav-item">
            <i class="fa-solid fa-house"></i> Início
          </a>
          <a href="./cadastrar-pet.html" class="nav-item ativo">
            <i class="fa-solid fa-paw"></i> Cadastrar Pet
          </a>
          <a href="./pets.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i> Gerenciar Pets
          </a>
          <a href="#" class="nav-item">
            <i class="fa-solid fa-file-signature"></i> Solicitações de Adoção
          </a>

          <p class="nav-grupo">Trabalho Voluntário</p>
          <a href="./cadastrar-servico-voluntario.html" class="nav-item">
            <i class="fa-solid fa-user-plus"></i> Cadastrar Serviços Voluntários
          </a>
          <a href="./servicos-voluntarios.html" class="nav-item">
            <i class="fa-solid fa-users-gear"></i> Gerenciar Serviços
            Voluntários
          </a>
          <a href="#" class="nav-item">
            <i class="fa-solid fa-people-carry-box"></i> Inscrições para
            Serviços Voluntários
          </a>
        </nav>
      </aside>

      <!-- ================= CONTEÚDO ================= -->
      <div class="painel-main">
        <!-- Topbar -->
        <header class="topbar">
          <button
            class="topbar-menu"
            id="menuToggle"
            aria-label="Abrir menu"
            aria-expanded="false"
          >
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="topbar-usuario" id="topbarUsuario">
            <i class="fa-solid fa-circle-user"></i>
            <span></span>
          </div>
          <div class="sair desktop" id="sair">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Sair</span>
          </div>
        </header>

        <!-- Área do formulário -->
        <main class="conteudo">
          <a href="./dashboard.html" class="voltar" aria-label="Voltar">
            <i class="fa-solid fa-arrow-left"></i>
          </a>

          <div class="titulo-bloco">
            <h1>Cadastrar novo pet</h1>
            <p>Preencha as informações para cadastrar um animal.</p>
          </div>

          <form id="formPet" class="form-card">
            <!-- Coluna esquerda: upload -->
            <div class="upload-col">
              <label for="img" class="upload-box" id="uploadBox">
                <input
                  type="file"
                  id="img"
                  name="img"
                  accept="image/*"
                  hidden
                />
                <div class="upload-conteudo" id="uploadConteudo">
                  <i class="fa-solid fa-plus"></i>
                  <strong>Adicionar imagem</strong>
                  <span>Clique para escolher uma foto</span>
                </div>
                <img id="previewImg" alt="Prévia da imagem" hidden />
              </label>
            </div>

            <!-- Coluna direita: campos -->
            <div class="campos-col">
              <!-- Linha 1 -->
              <div class="linha">
                <div class="campo">
                  <label for="nome">Nome do pet</label>
                  <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Ex.: Thor, Luna, Mel"
                    required
                  />
                </div>

                <div class="campo">
                  <label for="idade">Idade</label>
                  <input
                    type="number"
                    id="idade"
                    name="idade"
                    min="0"
                    max="40"
                    step="1"
                    placeholder="Ex.: 3"
                    required
                  />
                </div>
              </div>

              <!-- Linha 2 -->
              <div class="linha">
                <div class="campo">
                  <label for="grandeza_idade">Unidade de idade</label>
                  <select id="grandeza_idade" name="grandeza_idade" required>
                    <option value="" disabled selected>Selecione</option>
                    <option value="dias">Dias</option>
                    <option value="semanas">Semanas</option>
                    <option value="meses">Meses</option>
                    <option value="anos">Anos</option>
                  </select>
                </div>

                <div class="campo">
                  <label for="especie">Espécie</label>
                  <select id="especie" name="especie" required>
                    <option value="" disabled selected>Selecione</option>
                    <option value="cachorro">Cachorro</option>
                    <option value="gato">Gato</option>
                  </select>
                </div>

                <div class="campo">
                  <label for="peso">Peso (kg)</label>
                  <input
                    type="number"
                    id="peso"
                    name="peso"
                    min="0"
                    step="0.01"
                    placeholder="Ex.: 12.5"
                    required
                  />
                </div>

                <div class="campo">
                  <label for="sexo">Sexo</label>
                  <select id="sexo" name="sexo" required>
                    <option value="" disabled selected>Selecione</option>
                    <option value="macho">Macho</option>
                    <option value="femea">Fêmea</option>
                  </select>
                </div>
              </div>

              <!-- Linha 3 -->
              <div class="linha">
                <div class="campo">
                  <label for="raca">Raça</label>
                  <input
                    type="text"
                    id="raca"
                    name="raca"
                    placeholder="Ex.: SRD, Poodle, Vira-lata"
                    required
                  />
                </div>
              </div>

              <!-- Descrição -->
              <div class="campo">
                <label for="descricao">História do pet</label>
                <textarea
                  id="descricao"
                  name="descricao"
                  rows="5"
                  placeholder="Conte um pouco sobre o pet, sua história e personalidade…"
                  required
                ></textarea>
              </div>
            </div>

            <!-- Rodapé do form -->
            <div class="form-rodape">
              <button type="submit" class="botao-primario" id="botaoSalvar">
                <i class="fa-solid fa-plus"></i> Cadastrar pet
              </button>
              <a href="./dashboard.html" class="botao-secundario">Cancelar</a>
            </div>

            <p
              class="mensagem-form"
              id="mensagemForm"
              role="status"
              aria-live="polite"
            ></p>
          </form>
        </main>
      </div>
    </div>

    <!-- Modal de aviso reutilizável -->
    <div
      class="modal-overlay"
      id="modalAviso"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalAvisoTitulo"
      aria-describedby="modalAvisoTexto"
      hidden
    > 
      <div class="modal-caixa">
        <div class="modal-icone">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h3 id="modalAvisoTitulo">Aviso</h3>
        <p id="modalAvisoTexto"></p>
        <button type="button" class="modal-botao" id="modalAvisoOk">OK</button>
      </div>
    </div>

    <script type="module" src="./scripts/components/nomeAdmin.js"></script>
    <script type="module" src="./scripts/components/sidebar.js"></script>
    <script type="module" src="./scripts/components/logout.js"></script>
    <script type="module" src="./scripts/admin-cadastrar-pet.js"></script>
  </body>
</html>
