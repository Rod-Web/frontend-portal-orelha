<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Orelha | Serviços Voluntários</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="../styles/components/navbar-menu.css">
    <link rel="stylesheet" href="../styles/voluntariado.css">
</head>
<body>

    <header class="cabecalho">
        <a href="../index.html">
            <img src="../img/logodois.png" alt="Portal Orelha">
        </a>

        <button class="menu-tres" aria-label="Abrir menu" aria-expanded="false">☰</button>

        <nav class="menu">
            <a href="../index.html">Início</a>
            <a href="./voluntariado.html" class="ativo">Serviços Voluntários</a>
            <a href="../index.html#sobre">ONG</a>
            <a href="./doacao.html">Doações</a>
            <a href="./catalogo.html" class="botao-adotar">♡ Adotar</a>
        </nav>
    </header>

    <main>

        <section class="hero">
            <p class="sobretitulo">Faça parte</p>
            <h1>Encontre uma vaga que<br>caiba na sua rotina.</h1>
            <p class="hero-descricao">
                Doe seu tempo e carinho. Escolha uma oportunidade e faça a
                diferença na vida de um animal.
            </p>

            <div class="busca">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input
                    type="search"
                    id="campoBusca"
                    placeholder="Buscar por título, local ou palavra-chave…"
                    aria-label="Buscar vagas"
                    autocomplete="off"
                >
                <button
                    type="button"
                    id="limparBusca"
                    class="busca__limpar"
                    aria-label="Limpar busca"
                    hidden
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </section>

        <section class="vagas" aria-labelledby="titulo-vagas">

            <div class="vagas-cabecalho">
                <div class="vagas-titulo-grupo">
                    <h2 id="titulo-vagas">Vagas abertas</h2>
                    <span id="contadorVagas" class="vagas-contador">—</span>
                </div>
            </div>

            <div id="corpoVoluntariado" class="vagas-grid" aria-live="polite">
                <p class="vagas-mensagem">Carregando vagas…</p>
            </div>

        </section>

    </main>

    <footer>
        <p>Orelha © 2026 · Cuidando de quem precisa.</p>
    </footer>

    <script src="../scripts/components/menu-lateral.js"></script>
    <script type="module" src="../scripts/voluntariado.js"></script>
</body>
</html>
